# Values come from .env (see .env.example).
#   docker compose up -d postgres    database only, run the app from the IDE or ./mvnw
#   docker compose up -d --build     database and app on http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-applyledger}
      POSTGRES_USER: ${DB_USER:-applyledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-applyledger}
      DB_USER: ${DB_USER:-applyledger}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      APP_ZONE: ${APP_ZONE:-Europe/Berlin}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      # Only on this machine: there is no login yet (see ROADMAP.md).
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
