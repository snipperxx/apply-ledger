spring:
  application:
    name: apply-ledger
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/applyledger}
    username: ${DB_USER:applyledger}
    # No default on purpose: set DB_PASSWORD in the environment or in .env.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Empty values (e.g. no appliedOn on wishlist entries) sort last in both directions.
      hibernate.order_by.default_null_ordering: last
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

app:
  # "Today" for follow-ups and default status-change dates is computed in this zone.
  zone: ${APP_ZONE:Europe/Berlin}
  # APPLIED with no answer and nothing planned for this long shows up as "stale" in /api/follow-ups.
  stale-after-days: ${APP_STALE_AFTER_DAYS:14}

management:
  endpoints:
    web:
      exposure:
        include: health,info
